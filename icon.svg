<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#1a73e8"/>
  
  <!-- Page/Document with selection box -->
  <rect x="32" y="28" width="48" height="60" rx="2" fill="white"/>
  
  <!-- Selection box highlight -->
  <rect x="38" y="42" width="36" height="24" rx="1" fill="none" stroke="#1a73e8" stroke-width="3" stroke-dasharray="4 2"/>
  
  <!-- Printer icon at bottom -->
  <g transform="translate(44, 72)">
    <!-- Printer body -->
    <rect x="0" y="4" width="40" height="16" rx="2" fill="#5f6368"/>
    <!-- Paper tray -->
    <rect x="4" y="0" width="32" height="8" rx="1" fill="white"/>
    <!-- Paper output -->
    <rect x="4" y="16" width="32" height="12" rx="1" fill="white"/>
    <!-- Printer details -->
    <circle cx="32" cy="12" r="2" fill="#34a853"/>
    <rect x="8" y="10" width="16" height="2" rx="1" fill="#1a73e8"/>
  </g>
  
  <!-- Selection corner markers -->
  <path d="M 38 42 L 38 38 L 42 38" stroke="#1a73e8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 70 42 L 70 38 L 66 38" stroke="#1a73e8" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
