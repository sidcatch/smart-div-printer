<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Generate Marquee Tile — Smart Div Printer</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                background: #f1f3f4;
                padding: 24px;
            }
            canvas {
                border: 1px solid #dadce0;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
                max-width: 100%;
                height: auto;
            }
            button {
                margin-top: 16px;
                padding: 10px 18px;
                font-size: 14px;
                font-weight: 600;
                background: #1a73e8;
                color: #fff;
                border: none;
                border-radius: 6px;
                cursor: pointer;
            }
            button:hover {
                background: #1557b0;
            }
            h1 {
                font-size: 16px;
            }
        </style>
    </head>
    <body>
        <h1>Smart Div Printer — 1400×560 marquee promo tile</h1>
        <canvas id="tile" width="1400" height="560"></canvas>
        <br />
        <button id="download">Download PNG</button>

        <script>
            const W = 1400,
                H = 560;
            const canvas = document.getElementById('tile');
            const ctx = canvas.getContext('2d');

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, W, H);
            gradient.addColorStop(0, '#1a73e8');
            gradient.addColorStop(1, '#0d47a1');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, W, H);

            // Decorative circle accents
            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            ctx.beginPath();
            ctx.arc(1280, 90, 220, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(90, 480, 160, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(700, -60, 140, 0, Math.PI * 2);
            ctx.fill();

            function roundRect(context, x, y, w, h, r) {
                context.beginPath();
                context.moveTo(x + r, y);
                context.arcTo(x + w, y, x + w, y + h, r);
                context.arcTo(x + w, y + h, x, y + h, r);
                context.arcTo(x, y + h, x, y, r);
                context.arcTo(x, y, x + w, y, r);
                context.closePath();
            }

            // --- Icon: document with dashed selection + printer, mirrors icon.svg ---
            function drawIcon(x, y, s) {
                // White document
                roundRect(ctx, x + 32 * s, y + 28 * s, 48 * s, 60 * s, 4 * s);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                // Dashed selection box
                ctx.save();
                ctx.strokeStyle = '#1a73e8';
                ctx.lineWidth = 3 * s;
                ctx.setLineDash([5 * s, 3 * s]);
                roundRect(ctx, x + 38 * s, y + 42 * s, 36 * s, 24 * s, 2 * s);
                ctx.stroke();
                ctx.restore();

                // Printer body
                const px = x + 44 * s;
                const py = y + 72 * s;
                roundRect(ctx, px, py + 4 * s, 40 * s, 16 * s, 3 * s);
                ctx.fillStyle = '#5f6368';
                ctx.fill();

                roundRect(ctx, px + 4 * s, py, 32 * s, 8 * s, 2 * s);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                roundRect(ctx, px + 4 * s, py + 16 * s, 32 * s, 12 * s, 2 * s);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                ctx.fillStyle = '#34a853';
                ctx.beginPath();
                ctx.arc(px + 32 * s, py + 12 * s, 2.2 * s, 0, Math.PI * 2);
                ctx.fill();

                roundRect(ctx, px + 8 * s, py + 10 * s, 16 * s, 2 * s, 1 * s);
                ctx.fillStyle = '#1a73e8';
                ctx.fill();
            }

            // Large icon on the left, vertically centered
            const iconScale = 2.6;
            const iconDrawnHeight = 88 * iconScale; // approx bounding height of the icon art
            const iconX = 90;
            const iconY = (H - iconDrawnHeight) / 2 - 20;
            drawIcon(iconX, iconY, iconScale);

            // Title + tagline, right of the icon
            const textLeft = 520;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';

            ctx.fillStyle = '#ffffff';
            ctx.font =
                '700 76px system-ui, -apple-system, "Segoe UI", sans-serif';
            ctx.fillText('Smart Div Printer', textLeft, 250);

            ctx.font =
                '400 32px system-ui, -apple-system, "Segoe UI", sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.92)';
            ctx.fillText('Select any section to print clean —', textLeft, 320);
            ctx.fillText('or hide it from every future print.', textLeft, 362);

            // Feature chips
            const chips = [
                'Visual Selection',
                'Hide From Print',
                'Clean PDF Export',
            ];
            let chipX = textLeft;
            const chipY = 420;
            chips.forEach((label) => {
                ctx.font =
                    '600 22px system-ui, -apple-system, "Segoe UI", sans-serif';
                const paddingX = 22;
                const textWidth = ctx.measureText(label).width;
                const chipWidth = textWidth + paddingX * 2;
                const chipHeight = 48;

                roundRect(
                    ctx,
                    chipX,
                    chipY,
                    chipWidth,
                    chipHeight,
                    chipHeight / 2,
                );
                ctx.fillStyle = 'rgba(255,255,255,0.14)';
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.fillText(label, chipX + paddingX, chipY + 32);

                chipX += chipWidth + 18;
            });

            // Download handler
            document
                .getElementById('download')
                .addEventListener('click', () => {
                    const link = document.createElement('a');
                    link.download = 'marquee-1400x560.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
        </script>
    </body>
</html>
