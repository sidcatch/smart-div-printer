<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Generate Promo Tile — Smart Div Printer</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                background: #f1f3f4;
                padding: 24px;
            }
            canvas {
                border: 1px solid #dadce0;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            }
            button {
                margin-top: 16px;
                padding: 10px 18px;
                font-size: 14px;
                font-weight: 600;
                background: #1a73e8;
                color: #fff;
                border: none;
                border-radius: 6px;
                cursor: pointer;
            }
            button:hover {
                background: #1557b0;
            }
            h1 {
                font-size: 16px;
            }
        </style>
    </head>
    <body>
        <h1>Smart Div Printer — 440×280 promo tile</h1>
        <canvas id="tile" width="440" height="280"></canvas>
        <br />
        <button id="download">Download PNG</button>

        <script>
            const canvas = document.getElementById('tile');
            const ctx = canvas.getContext('2d');

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, 440, 280);
            gradient.addColorStop(0, '#1a73e8');
            gradient.addColorStop(1, '#0d47a1');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 440, 280);

            // Decorative circle accents
            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            ctx.beginPath();
            ctx.arc(400, 40, 90, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(30, 260, 70, 0, Math.PI * 2);
            ctx.fill();

            // --- Icon: document with dashed selection + printer, mirrors icon.svg ---
            const iconX = 24;
            const iconY = 20;
            const scale = 0.85;

            function drawIcon(x, y, s) {
                // White document
                roundRect(ctx, x + 32 * s, y + 28 * s, 48 * s, 60 * s, 4 * s);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                // Dashed selection box
                ctx.save();
                ctx.strokeStyle = '#1a73e8';
                ctx.lineWidth = 3 * s;
                ctx.setLineDash([5 * s, 3 * s]);
                roundRect(ctx, x + 38 * s, y + 42 * s, 36 * s, 24 * s, 2 * s);
                ctx.stroke();
                ctx.restore();

                // Printer body
                const px = x + 44 * s;
                const py = y + 72 * s;
                roundRect(ctx, px, py + 4 * s, 40 * s, 16 * s, 3 * s);
                ctx.fillStyle = '#5f6368';
                ctx.fill();

                roundRect(ctx, px + 4 * s, py, 32 * s, 8 * s, 2 * s);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                roundRect(ctx, px + 4 * s, py + 16 * s, 32 * s, 12 * s, 2 * s);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                ctx.fillStyle = '#34a853';
                ctx.beginPath();
                ctx.arc(px + 32 * s, py + 12 * s, 2.2 * s, 0, Math.PI * 2);
                ctx.fill();

                roundRect(ctx, px + 8 * s, py + 10 * s, 16 * s, 2 * s, 1 * s);
                ctx.fillStyle = '#1a73e8';
                ctx.fill();
            }

            function roundRect(context, x, y, w, h, r) {
                context.beginPath();
                context.moveTo(x + r, y);
                context.arcTo(x + w, y, x + w, y + h, r);
                context.arcTo(x + w, y + h, x, y + h, r);
                context.arcTo(x, y + h, x, y, r);
                context.arcTo(x, y, x + w, y, r);
                context.closePath();
            }

            drawIcon(iconX, iconY, scale);

            // Title, auto-shrunk to fit the tile width
            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';
            ctx.fillStyle = '#ffffff';
            const title = 'Smart Div Printer';
            let titleSize = 40;
            do {
                ctx.font = `700 ${titleSize}px system-ui, -apple-system, "Segoe UI", sans-serif`;
                titleSize -= 1;
            } while (ctx.measureText(title).width > 380 && titleSize > 18);
            ctx.fillText(title, 220, 160);

            // Tagline, centered under the title
            ctx.font =
                '400 15px system-ui, -apple-system, "Segoe UI", sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fillText('Select any section to print clean —', 220, 195);
            ctx.fillText('or hide it from every future print.', 220, 218);

            // Download handler
            document
                .getElementById('download')
                .addEventListener('click', () => {
                    const link = document.createElement('a');
                    link.download = 'small-tile-440x280.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
        </script>
    </body>
</html>
